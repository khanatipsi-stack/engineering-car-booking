<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ระบบจองรถส่วนกลาง - Engineering Div</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sarabun',sans-serif;background:#F5F5F0;color:#1a1a1a;min-height:100vh}

.topbar{background:#1D9E75;color:white;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.topbar h1{font-size:17px;font-weight:600}
.topbar .sub{font-size:11px;opacity:.75;margin-top:2px}
.sync-btn{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.4);color:white;padding:6px 14px;border-radius:8px;font-size:12px;cursor:pointer;font-family:'Sarabun',sans-serif;white-space:nowrap;transition:background .15s}
.sync-btn:hover{background:rgba(255,255,255,.3)}
.sync-btn:disabled{opacity:.5;cursor:default}

.container{max-width:720px;margin:0 auto;padding:16px}

.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat{background:white;border-radius:10px;padding:12px 14px;border:.5px solid #e0e0d8}
.stat .sl{font-size:11px;color:#888;margin-bottom:3px}
.stat .sv{font-size:22px;font-weight:600}
.sv.green{color:#1D9E75}.sv.red{color:#D85A30}

.tabs{display:flex;border:.5px solid #ddd;border-radius:10px;overflow:hidden;margin-bottom:16px;width:100%}
.tab{flex:1;padding:9px 8px;font-size:12px;cursor:pointer;color:#888;background:white;border:none;font-family:'Sarabun',sans-serif;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}
.tab.on{background:#F0F0EC;color:#1a1a1a;font-weight:600}
.tab:hover:not(.on){background:#fafaf8}

.card{background:white;border:.5px solid #e0e0d8;border-radius:12px;padding:16px;margin-bottom:12px}
.card-title{font-size:13px;font-weight:600;color:#444;margin-bottom:12px}

/* car select */
.car-sel{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:4px}
.car-opt{border:1.5px solid #e0e0d8;border-radius:12px;padding:12px;cursor:pointer;transition:all .15s;background:white}
.car-opt:hover:not(.busy-car){border-color:#1D9E75}
.car-opt.selected{border-color:#1D9E75;background:#E8F8F2}
.car-opt.busy-car{opacity:.45;pointer-events:none;background:#f0f0f0;border-color:#cccccc;cursor:not-allowed}
.car-opt.busy-car .car-icon{filter:grayscale(1)}
.car-icon{font-size:24px}
.cn{font-size:13px;font-weight:600;margin-top:6px;color:#1a1a1a}
.cp{font-size:11px;color:#888;margin-top:2px}
.cbadge{font-size:10px;padding:2px 8px;border-radius:20px}
.avail-b{background:#E1F5EE;color:#0F6E56}
.busy-b{background:#e0e0e0;color:#777777}
.location-tag{font-size:10px;color:#1D9E75;margin-top:4px;background:#f0faf6;padding:3px 6px;border-radius:4px}
.mileage-tag{font-size:10px;color:#185FA5;margin-top:3px;background:#eef4fc;padding:3px 6px;border-radius:4px}
.busy-reason{font-size:10px;color:#888;margin-top:4px;background:#f5f5f5;padding:3px 6px;border-radius:4px}

/* form */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-size:12px;color:#666}
.req{color:#D85A30}
.field input,.field select,.field textarea{font-size:13px;padding:9px 11px;border-radius:8px;border:1px solid #ddd;background:white;color:#1a1a1a;font-family:'Sarabun',sans-serif;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:#1D9E75;box-shadow:0 0 0 3px rgba(29,158,117,.08)}
.field textarea{height:68px;resize:none}
.submit-btn{width:100%;padding:12px;background:#1D9E75;color:white;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;font-family:'Sarabun',sans-serif;transition:background .15s;margin-top:4px}
.submit-btn:hover{background:#0F6E56}
.submit-btn.blue{background:#185FA5}.submit-btn.blue:hover{background:#0c3d6e}
.submit-btn.red{background:#c0392b}.submit-btn.red:hover{background:#a93226}
.submit-btn:disabled{background:#aaa;cursor:default}

/* toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1D9E75;color:white;padding:10px 22px;border-radius:10px;font-size:13px;font-weight:600;z-index:9999;display:none;white-space:nowrap;pointer-events:none}
.toast.err{background:#D85A30}

/* modal */
.modal-overlay{background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:24px;position:fixed;inset:0;z-index:1000}
.modal-box{background:white;padding:22px;border-radius:16px;max-width:440px;width:100%;box-shadow:0 8px 24px rgba(0,0,0,.15);max-height:90vh;overflow-y:auto}
.modal-title{font-size:16px;font-weight:600;color:#1D9E75;margin-bottom:14px}
.modal-title.warn{color:#c0392b}
.modal-line{font-size:13px;margin-bottom:8px;color:#444;line-height:1.5}
.modal-btn{width:100%;padding:10px;background:#1D9E75;color:white;border:none;border-radius:8px;cursor:pointer;font-weight:600;font-family:'Sarabun',sans-serif;margin-top:8px;font-size:14px}
.modal-btn.grey{background:#888}
.modal-btn.red{background:#c0392b}
.pin-wrap{display:flex;gap:8px;margin-top:6px}
.pin-wrap input{flex:1;font-size:15px;padding:10px;border:1.5px solid #ddd;border-radius:8px;font-family:'Sarabun',sans-serif;letter-spacing:4px;text-align:center}
.pin-wrap input:focus{outline:none;border-color:#185FA5}
.pin-err{color:#c0392b;font-size:12px;margin-top:6px;display:none}

/* list */
.brow{background:white;border:.5px solid #e0e0d8;border-radius:12px;padding:14px;margin-bottom:10px}
.brow-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px}
.brow-name{font-size:13px;font-weight:600;color:#1a1a1a}
.brow-car{font-size:11px;color:#888;margin-top:2px}
.brow-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:11px}
.brow-field{color:#999;margin-bottom:2px}
.brow-val{color:#333;font-weight:600}
.badge{font-size:10px;padding:3px 9px;border-radius:20px;white-space:nowrap;flex-shrink:0}
.badge.active{background:#E1F5EE;color:#0F6E56}
.badge.returned{background:#E8EEFF;color:#2a46aa}
.badge.cancelled{background:#F5F5F0;color:#999}
.cancel-btn{font-size:11px;padding:3px 10px;border:1px solid #e0c0c0;background:#fff8f6;color:#c0392b;border-radius:6px;cursor:pointer;font-family:'Sarabun',sans-serif;flex-shrink:0}
.cancel-btn:hover{background:#FAECE7}
.filter-bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.filter-btn{font-size:11px;padding:4px 12px;border-radius:20px;border:.5px solid #ddd;background:white;color:#666;cursor:pointer;font-family:'Sarabun',sans-serif}
.filter-btn.on{background:#1D9E75;color:white;border-color:#1D9E75}

/* ===== MONTHLY CALENDAR ===== */
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.cal-nav-title{font-size:15px;font-weight:600;color:#333}
.cal-nav-btn{background:none;border:1px solid #ddd;border-radius:8px;padding:5px 12px;cursor:pointer;font-size:14px;font-family:'Sarabun',sans-serif;color:#555;transition:background .12s}
.cal-nav-btn:hover{background:#f0f0ec}
.cal-today-btn{background:none;border:1px solid #1D9E75;border-radius:8px;padding:5px 12px;cursor:pointer;font-size:11px;font-family:'Sarabun',sans-serif;color:#1D9E75;transition:background .12s}
.cal-today-btn:hover{background:#e8f8f2}

.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-header-cell{text-align:center;font-size:11px;font-weight:600;color:#888;padding:5px 2px}
.cal-header-cell.weekend{color:#c0392b}
.cal-cell{min-height:72px;border:.5px solid #e8e8e3;border-radius:7px;padding:5px;background:white;vertical-align:top;position:relative}
.cal-cell.other-month{background:#f8f8f5;opacity:.55}
.cal-cell.today-cell{border-color:#1D9E75;background:#F0FBF5}
.cal-cell.has-booking{background:#fffcf5}
.cal-day-num{font-size:11px;font-weight:600;color:#666;display:block;margin-bottom:3px;text-align:right}
.cal-cell.today-cell .cal-day-num{color:#1D9E75}
.cal-cell.weekend-cell .cal-day-num{color:#c0392b}
.cal-booking-chip{font-size:9px;padding:2px 4px;border-radius:3px;margin-bottom:2px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.chip-car1{background:#daf0e8;color:#0a5c40}
.chip-car2{background:#dde8ff;color:#1a3c8a}

.empty{text-align:center;padding:2.5rem;color:#aaa;font-size:13px}

.loading-overlay{position:fixed;inset:0;background:rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center;z-index:2000;font-size:14px;color:#555;gap:10px}
.spinner{width:20px;height:20px;border:2.5px solid #e0e0d8;border-top-color:#1D9E75;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:480px){
  .grid2{grid-template-columns:1fr}
  .brow-grid{grid-template-columns:1fr 1fr}
  .tabs .tab{font-size:10px;padding:8px 4px}
  .cal-cell{min-height:54px;padding:3px}
  .cal-booking-chip{font-size:8px}
  .cal-day-num{font-size:10px}
}
</style>
</head>
<body>

<div class="topbar">
  <div>
    <h1>🚗 ระบบจองรถส่วนกลาง</h1>
    <div class="sub">Engineering Division · <span id="sync-status-text">กำลังโหลด...</span></div>
  </div>
  <button class="sync-btn" id="sync-btn" onclick="syncFromSheets(true)">⟳ ซิงค์</button>
</div>

<div class="container">
  <div id="root"></div>
</div>

<div id="modal-container"></div>
<div class="toast" id="toast"></div>
<div class="loading-overlay" id="loading-overlay" style="display:none">
  <div class="spinner"></div><span id="loading-text">กำลังโหลด...</span>
</div>

<script>
// =============================================
// ⚙️ CONFIG
// =============================================
const GAS_URL = 'https://script.google.com/macros/s/AKfycbxqZkXNGhEh3HYV1GOXwP1yIGl6skviGPkylZ7JAPSQAPg6VrMl6NeiQjgxilULpAc/exec';
const ADMIN_PIN = '10080235';

const CARS = [
  {id:'CAR1', name:'Toyota Yaris Ativ', plate:'1723', icon:'🚗'},
  {id:'CAR2', name:'Toyota Yaris Ativ', plate:'7902', icon:'🚗'},
];

// =============================================
// STATE
// =============================================
let bookings = [];
let tab = 'form';
let filter = 'all';
let selCar = null;
let returnCarId = null;
let isSyncing = false;
let syncTimer = null;
let jsonpCounter = 0;

// Calendar state: ปีและเดือนปัจจุบันที่กำลังดู
let calYear = new Date().getFullYear();
let calMonth = new Date().getMonth(); // 0-indexed

let form = {name:'',dept:'',phone:'',dateFrom:'',dateTo:'',purpose:'',driver:'',email:''};

// =============================================
// UTILITIES
// =============================================
function esc(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
}
function pad(n) { return String(n).padStart(2,'0'); }

function showToast(msg, isErr=false) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast' + (isErr ? ' err' : '');
  el.style.display = 'block';
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.style.display='none'; }, 2800);
}
function setLoading(show, text='กำลังบันทึก...') {
  document.getElementById('loading-overlay').style.display = show ? 'flex' : 'none';
  document.getElementById('loading-text').textContent = text;
}
function setSyncStatus(text) {
  const el = document.getElementById('sync-status-text');
  if (el) el.textContent = text;
}

// =============================================
// FIX #3: เช็คการจองซ้อน — รองรับวันเดียว (from === to)
// ใช้การเปรียบเทียบ string YYYY-MM-DD โดยตรง ป้องกัน timezone shift
// =============================================
function isCarBusy(carId, fromDate, toDate) {
  if (!fromDate || !toDate) return false;
  return bookings.some(b => {
    if (b.carId !== carId || b.status !== 'active') return false;
    const bFrom = String(b.dateFrom).split('T')[0];
    const bTo   = String(b.dateTo).split('T')[0];
    // overlap: newStart <= existEnd AND newEnd >= existStart
    return (fromDate <= bTo && toDate >= bFrom);
  });
}

// หาชื่อคนที่จองรถคันนี้ในช่วงที่เลือก (สำหรับแสดงใต้ปุ่มรถ)
function getBusyBooking(carId, fromDate, toDate) {
  if (!fromDate || !toDate) return null;
  return bookings.find(b => {
    if (b.carId !== carId || b.status !== 'active') return false;
    const bFrom = String(b.dateFrom).split('T')[0];
    const bTo   = String(b.dateTo).split('T')[0];
    return (fromDate <= bTo && toDate >= bFrom);
  }) || null;
}

function getLastInfo(carId) {
  const base = bookings.filter(b => b.carId === carId && (b.status==='active' || b.status==='returned'));
  const sorted = [...base].sort((a,b) => {
    if (a.status==='returned' && b.status!=='returned') return -1;
    if (b.status==='returned' && a.status!=='returned') return  1;
    return (b.createdAt||'').localeCompare(a.createdAt||'');
  });
  if (sorted.length && sorted[0].floor && sorted[0].pillar) {
    return { floor:sorted[0].floor, pillar:sorted[0].pillar, by:sorted[0].name, mileage:sorted[0].mileage||'' };
  }
  return { floor:'ชั้น 1', pillar:'ลานจอดหลัก', by:'ระบบเริ่มต้น', mileage:'' };
}

// =============================================
// JSONP ENGINE
// =============================================
function jsonpCall(params, onSuccess, onError, timeoutMs=15000) {
  const cbName = '__jsonp_' + (++jsonpCounter) + '_' + Date.now();
  const scriptId = 'jsonp_' + jsonpCounter;
  let done = false;
  const cleanup = () => { done=true; clearTimeout(timer); delete window[cbName]; const s=document.getElementById(scriptId); if(s)s.remove(); };
  window[cbName] = function(data) { if(done)return; cleanup(); if(data&&data.success)onSuccess(data); else onError(data?(data.error||data.message||'Server error'):'No response'); };
  const timer = setTimeout(() => { if(done)return; cleanup(); onError('Timeout — ตรวจสอบ GAS_URL'); }, timeoutMs);
  const url = GAS_URL+'?'+params+'&callback='+cbName+'&_t='+Date.now();
  const script = document.createElement('script');
  script.id = scriptId; script.src = url;
  script.onerror = () => { if(done)return; cleanup(); onError('Script load error'); };
  document.body.appendChild(script);
}

// =============================================
// SYNC DATA
// =============================================
function syncFromSheets(manual=false) {
  if (isSyncing) return;
  isSyncing = true;
  const btn = document.getElementById('sync-btn');
  if (btn) { btn.disabled=true; btn.textContent='⟳ กำลังซิงค์...'; }
  if (manual) setSyncStatus('กำลังซิงค์...');
  jsonpCall('action=getBookings',
    (data) => {
      isSyncing = false;
      if (btn) { btn.disabled=false; btn.textContent='⟳ ซิงค์'; }
      bookings = data.bookings || [];
      const now = new Date();
      setSyncStatus('ซิงค์ล่าสุด '+pad(now.getHours())+':'+pad(now.getMinutes())+':'+pad(now.getSeconds()));
      render();
      if (manual) showToast('ซิงค์สำเร็จ ('+bookings.length+' รายการ) ✓');
    },
    (err) => {
      isSyncing = false;
      if (btn) { btn.disabled=false; btn.textContent='⟳ ซิงค์'; }
      setSyncStatus('ซิงค์ไม่สำเร็จ');
      if (manual) showToast('ซิงค์ไม่สำเร็จ: '+err, true);
    }
  );
}
function scheduleAutoSync() {
  clearTimeout(syncTimer);
  syncTimer = setTimeout(() => { syncFromSheets(false); scheduleAutoSync(); }, 60000);
}

// =============================================
// MODALS
// =============================================
function showModal(title, lines, onClose, opts={}) {
  const container = document.getElementById('modal-container');
  const titleClass = opts.warn ? 'modal-title warn' : 'modal-title';
  const linesHTML = lines.map(l=>`<div class="modal-line">${l}</div>`).join('');
  container.innerHTML = `<div class="modal-overlay"><div class="modal-box" onclick="event.stopPropagation()">
    <div class="${titleClass}">${title}</div>${linesHTML}
    <button class="modal-btn ${opts.btnClass||''}" onclick="closeModal()">${opts.btnLabel||'รับทราบ'}</button>
  </div></div>`;
  window._modalCb = onClose || null;
}
function closeModal() {
  document.getElementById('modal-container').innerHTML = '';
  if (window._modalCb) { window._modalCb(); window._modalCb = null; }
}
function askAdminPin(onSuccess) {
  const container = document.getElementById('modal-container');
  container.innerHTML = `<div class="modal-overlay"><div class="modal-box" onclick="event.stopPropagation()" style="max-width:360px">
    <div class="modal-title warn">🔐 ยืนยันสิทธิ์ Admin</div>
    <div class="modal-line">การยกเลิกการจองต้องได้รับอนุมัติจาก Admin เท่านั้น</div>
    <div class="modal-line" style="margin-top:4px">กรุณาใส่รหัส Admin:</div>
    <div class="pin-wrap"><input type="password" id="admin-pin-input" maxlength="12" placeholder="••••••••" inputmode="numeric" onkeydown="if(event.key==='Enter') confirmAdminPin()"/></div>
    <div class="pin-err" id="pin-err">รหัสไม่ถูกต้อง กรุณาลองใหม่</div>
    <button class="modal-btn red" style="margin-top:14px" onclick="confirmAdminPin()">✓ ยืนยัน</button>
    <button class="modal-btn grey" onclick="closeModal()">ยกเลิก</button>
  </div></div>`;
  window._adminPinCb = onSuccess;
  setTimeout(() => { const inp=document.getElementById('admin-pin-input'); if(inp)inp.focus(); }, 100);
}
function confirmAdminPin() {
  const inp = document.getElementById('admin-pin-input');
  const errEl = document.getElementById('pin-err');
  if (!inp) return;
  if (inp.value === ADMIN_PIN) {
    closeModal();
    if (window._adminPinCb) { window._adminPinCb(); window._adminPinCb = null; }
  } else {
    errEl.style.display = 'block'; inp.value = ''; inp.focus();
    inp.style.borderColor = '#c0392b';
    setTimeout(() => { inp.style.borderColor = '#ddd'; }, 1200);
  }
}

// =============================================
// FORM ACTIONS
// =============================================
function captureForm() {
  ['name','dept','phone','email','driver','purpose'].forEach(k => {
    const el = document.getElementById('f-'+k);
    if (el) form[k] = el.value;
  });
}
function updateDates() {
  const fe = document.getElementById('f-from');
  const te = document.getElementById('f-to');
  if (fe) form.dateFrom = fe.value;
  if (te) form.dateTo   = te.value;
  // FIX #3: ถ้าวันคืนน้อยกว่าวันยืม ให้ดึง dateTo มาเท่ากับ dateFrom (รองรับจองวันเดียว)
  if (form.dateFrom && form.dateTo && form.dateTo < form.dateFrom) {
    form.dateTo = form.dateFrom;
    if (te) te.value = form.dateFrom;
  }
  captureForm();
  // FIX #1: re-check car availability — ถ้าคันที่เลือกไว้กลายเป็นไม่ว่าง ให้ clear
  if (selCar && isCarBusy(selCar, form.dateFrom, form.dateTo)) selCar = null;
  render();
}
function setSelCar(id) { captureForm(); selCar = id; render(); }
function setTab(t) { captureForm(); tab = t; render(); }
function setFilter(f) { filter = f; render(); }
function selectReturn(id) { returnCarId = id; render(); }

// Calendar navigation
function calPrev() { calMonth--; if(calMonth<0){calMonth=11;calYear--;} render(); }
function calNext() { calMonth++; if(calMonth>11){calMonth=0;calYear++;} render(); }
function calGoToday() { calYear=new Date().getFullYear(); calMonth=new Date().getMonth(); render(); }

// =============================================
// SUBMIT BOOKING
// =============================================
function submit() {
  captureForm();
  if (!form.dateFrom || !form.dateTo)  { showToast('ระบุวันที่ยืม-คืนก่อนครับ', true); return; }
  // FIX #3: อนุญาตให้ dateFrom === dateTo (จองวันเดียว)
  if (form.dateTo < form.dateFrom)     { showToast('วันคืนต้องไม่ก่อนวันยืม', true); return; }
  if (!selCar)                         { showToast('เลือกรถยนต์ก่อนครับ', true); return; }
  if (isCarBusy(selCar, form.dateFrom, form.dateTo)) {
    showToast('รถคันนี้มีการจองในช่วงวันดังกล่าวแล้ว กรุณาซิงค์ข้อมูลและเลือกใหม่', true);
    selCar = null; render(); return;
  }
  if (!form.name.trim())   { showToast('ระบุชื่อผู้ใช้งาน', true); return; }
  if (!form.email.trim() || !form.email.includes('@')) { showToast('ระบุ Email ให้ถูกต้อง', true); return; }
  if (!form.purpose.trim()) { showToast('ระบุวัตถุประสงค์', true); return; }

  const info = getLastInfo(selCar);
  const car  = CARS.find(c => c.id === selCar);
  const id   = Date.now().toString();
  const now  = new Date().toISOString();

  const params = [
    'action=addBooking',
    'id='       + encodeURIComponent(id),
    'carId='    + encodeURIComponent(selCar),
    'name='     + encodeURIComponent(form.name.trim()),
    'dept='     + encodeURIComponent(form.dept.trim()),
    'phone='    + encodeURIComponent(form.phone.trim()),
    'driver='   + encodeURIComponent(form.driver.trim()),
    'email='    + encodeURIComponent(form.email.trim()),
    'dateFrom=' + encodeURIComponent(form.dateFrom),
    'dateTo='   + encodeURIComponent(form.dateTo),
    'purpose='  + encodeURIComponent(form.purpose.trim()),
    'floor='    + encodeURIComponent(info.floor),
    'pillar='   + encodeURIComponent(info.pillar),
    'status=active',
    'createdAt='+ encodeURIComponent(now),
  ].join('&');

  setLoading(true, 'กำลังบันทึกการจอง...');
  jsonpCall(params,
    () => {
      setLoading(false);
      showModal('🎉 ส่งคำขอจองสำเร็จ!', [
        `<b>🚗 รถทะเบียน:</b> ${car.plate} (${car.name})`,
        `<b>👤 ผู้จอง:</b> ${esc(form.name)}`,
        `<b>📅 วันยืม:</b> ${form.dateFrom} &nbsp;→&nbsp; <b>วันคืน:</b> ${form.dateTo}`,
        `<b>🅿️ พิกัดรับรถ:</b> <span style="color:#1D9E75;font-weight:600">${esc(info.floor)} เสา ${esc(info.pillar)}</span>`,
        `<br><small style="color:#aaa">✉️ ส่งข้อมูลไปที่อีเมลของคุณเรียบร้อย</small>`,
      ], () => { showReminderModal(car, info); });
      form = {name:'',dept:'',phone:'',dateFrom:'',dateTo:'',purpose:'',driver:'',email:''};
      selCar = null;
    },
    (err) => {
      setLoading(false);
      showToast(err, true);
      syncFromSheets(false);
    }
  );
}

// RETURN CAR
// =============================================
function executeReturn(id) {
  const floorVal   = (document.getElementById('ret-floor')   || {}).value || '';
  const pillarVal  = (document.getElementById('ret-pillar')  || {}).value || '';
  const mileageVal = (document.getElementById('ret-mileage') || {}).value || '';
  if (!floorVal.trim())   { showToast('ระบุชั้นที่จอดคืน', true); return; }
  if (!pillarVal.trim())  { showToast('ระบุเลขเสาที่จอดคืน', true); return; }
  if (!mileageVal.trim()) { showToast('ระบุเลขไมล์สุดท้ายก่อนคืนรถ', true); return; }
  if (isNaN(Number(mileageVal))) { showToast('เลขไมล์ต้องเป็นตัวเลขเท่านั้น', true); return; }
  const b = bookings.find(x => x.id == id);
  const car = b ? CARS.find(c => c.id === b.carId) : null;
  if (!b) { showToast('ไม่พบรายการจอง', true); return; }
  const params = [
    'action=updateStatus','id='+encodeURIComponent(id),'status=returned',
    'floor='+encodeURIComponent(floorVal.trim()),
    'pillar='+encodeURIComponent(pillarVal.trim()),
    'mileage='+encodeURIComponent(mileageVal.trim()),
  ].join('&');
  setLoading(true, 'กำลังบันทึกการคืนรถ...');
  jsonpCall(params,
    () => {
      setLoading(false); returnCarId = null;
      showModal('✅ คืนรถสำเร็จ!', [
        `<b>🚗 รถทะเบียน:</b> ${car ? car.plate : ''}`,
        `<b>👤 ผู้คืน:</b> ${esc(b.name)}`,
        `<b>🅿️ จอดคืนที่:</b> ${esc(floorVal.trim())} เสา ${esc(pillarVal.trim())}`,
        `<b>🔢 เลขไมล์สุดท้าย:</b> <span style="color:#185FA5;font-weight:600">${esc(mileageVal.trim())} กม.</span>`,
      ], () => { tab='list'; syncFromSheets(false); });
    },
    (err) => { setLoading(false); showToast('บันทึกไม่สำเร็จ: '+err, true); }
  );
}

function cancelBook(id) {
  askAdminPin(() => {
    const params = 'action=updateStatus&id='+encodeURIComponent(id)+'&status=cancelled';
    setLoading(true, 'กำลังยกเลิก...');
    jsonpCall(params,
      () => { setLoading(false); syncFromSheets(false); showToast('ยกเลิกการจองสำเร็จ ✓'); },
      (err) => { setLoading(false); showToast('ยกเลิกไม่สำเร็จ: '+err, true); }
    );
  });
}

// =============================================
// FIX #2: MONTHLY CALENDAR — แสดงทั้งเดือน + ดูย้อนหลัง/ล่วงหน้า
// =============================================
function generateMonthlyCalendar() {
  const thMonths = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน',
                    'กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
  const dayHeaders = ['จ','อ','พ','พฤ','ศ','ส','อา'];
  const today = todayStr();

  // หาวันแรกและวันสุดท้ายของเดือน
  const firstDay = new Date(calYear, calMonth, 1);
  const lastDay  = new Date(calYear, calMonth+1, 0);

  // หาวันจันทร์แรกที่แสดงในตาราง (อาจเป็นเดือนก่อน)
  let startDow = firstDay.getDay(); // 0=อา, 1=จ, ...
  // แปลง: จันทร์ = 0 index
  let startOffset = (startDow === 0) ? 6 : startDow - 1;
  const gridStart = new Date(firstDay);
  gridStart.setDate(1 - startOffset);

  // header nav
  let html = `
    <div class="cal-nav">
      <button class="cal-nav-btn" onclick="calPrev()">‹</button>
      <div>
        <span class="cal-nav-title">${thMonths[calMonth]} ${calYear + 543}</span>
        <button class="cal-today-btn" style="margin-left:8px" onclick="calGoToday()">วันนี้</button>
      </div>
      <button class="cal-nav-btn" onclick="calNext()">›</button>
    </div>
    <div class="cal-grid">`;

  // day headers
  dayHeaders.forEach((d, i) => {
    html += `<div class="cal-header-cell ${i>=5?'weekend':''}">${d}</div>`;
  });

  // cells — 6 rows × 7 = 42 cells
  for (let row = 0; row < 6; row++) {
    for (let col = 0; col < 7; col++) {
      const cellDate = new Date(gridStart);
      cellDate.setDate(gridStart.getDate() + row*7 + col);
      const ds = cellDate.getFullYear()+'-'+pad(cellDate.getMonth()+1)+'-'+pad(cellDate.getDate());
      const isThisMonth = cellDate.getMonth() === calMonth;
      const isToday = ds === today;
      const isWeekend = col >= 5;

      // หารายการจองในวันนี้
      const c1 = bookings.filter(b => b.carId==='CAR1' && b.status==='active'
        && ds >= String(b.dateFrom).split('T')[0] && ds <= String(b.dateTo).split('T')[0]);
      const c2 = bookings.filter(b => b.carId==='CAR2' && b.status==='active'
        && ds >= String(b.dateFrom).split('T')[0] && ds <= String(b.dateTo).split('T')[0]);
      const hasBooking = c1.length > 0 || c2.length > 0;

      let cls = 'cal-cell';
      if (!isThisMonth) cls += ' other-month';
      if (isToday)      cls += ' today-cell';
      if (isWeekend && isThisMonth) cls += ' weekend-cell';
      if (hasBooking)   cls += ' has-booking';

      let chips = '';
      c1.forEach(b => {
        chips += `<span class="cal-booking-chip chip-car1" title="${esc(b.name)}">1723: ${esc(b.name)}</span>`;
      });
      c2.forEach(b => {
        chips += `<span class="cal-booking-chip chip-car2" title="${esc(b.name)}">7902: ${esc(b.name)}</span>`;
      });

      html += `<div class="${cls}">
        <span class="cal-day-num">${cellDate.getDate()}</span>
        ${chips}
      </div>`;
    }
  }

  html += `</div>
    <div style="display:flex;gap:12px;margin-top:10px;font-size:11px;color:#666;flex-wrap:wrap">
      <span><span style="background:#daf0e8;color:#0a5c40;padding:1px 6px;border-radius:3px">■</span> ทะเบียน 1723</span>
      <span><span style="background:#dde8ff;color:#1a3c8a;padding:1px 6px;border-radius:3px">■</span> ทะเบียน 7902</span>
    </div>`;
  return html;
}

          <div><div class="brow-field">เบอร์ติดต่อ</div><div class="brow-val">${esc(b.phone||'-')}</div></div>
        </div>
        <div style="font-size:11px;color:#666;margin-top:8px;border-top:.5px solid #eee;padding-top:6px;line-height:1.4">
          <b>📍 พิกัดจอด:</b> ${esc(b.floor||'-')} เสา ${esc(b.pillar||'-')} ${b.mileage?`| 🔢 <b>เลขไมล์:</b> ${esc(b.mileage)} กม.`:''}<br>
          <b>💡 ไปที่ไหน/ทำอะไร:</b> ${esc(b.purpose)}
        </div>
      </div>`;
    }).join('');
    content = `
      <div class="filter-bar">
        <button class="filter-btn ${filter==='all'?'on':''}" onclick="setFilter('all')">ทั้งหมด</button>
        <button class="filter-btn ${filter==='active'?'on':''}" onclick="setFilter('active')">กำลังจอง</button>
        <button class="filter-btn ${filter==='returned'?'on':''}" onclick="setFilter('returned')">คืนแล้ว</button>
        <button class="filter-btn ${filter==='cancelled'?'on':''}" onclick="setFilter('cancelled')">ยกเลิกแล้ว</button>
      </div>
      ${cards || '<div class="empty">ไม่พบข้อมูลประวัติการจอง</div>'}`;
  }

  document.getElementById('root').innerHTML = stats + tabBar + content;
}

// =============================================
// INITIALIZE
// =============================================
window.onload = function() {
  syncFromSheets(false);
  scheduleAutoSync();
};
</script>
</body>
