<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ระบบจองรถส่วนกลาง - Engineering Div</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sarabun',sans-serif;background:#F5F5F0;color:#1a1a1a;min-height:100vh}

.topbar{background:#1D9E75;color:white;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.topbar h1{font-size:17px;font-weight:600}
.topbar .sub{font-size:11px;opacity:.75;margin-top:2px}
.sync-btn{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.4);color:white;padding:6px 14px;border-radius:8px;font-size:12px;cursor:pointer;font-family:'Sarabun',sans-serif;white-space:nowrap;transition:background .15s}
.sync-btn:hover{background:rgba(255,255,255,.3)}
.sync-btn:disabled{opacity:.5;cursor:default}

.container{max-width:720px;margin:0 auto;padding:16px}

.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat{background:white;border-radius:10px;padding:12px 14px;border:.5px solid #e0e0d8}
.stat .sl{font-size:11px;color:#888;margin-bottom:3px}
.stat .sv{font-size:22px;font-weight:600}
.sv.green{color:#1D9E75}.sv.red{color:#D85A30}

.tabs{display:flex;border:.5px solid #ddd;border-radius:10px;overflow:hidden;margin-bottom:16px;width:100%}
.tab{flex:1;padding:9px 8px;font-size:12px;cursor:pointer;color:#888;background:white;border:none;font-family:'Sarabun',sans-serif;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}
.tab.on{background:#F0F0EC;color:#1a1a1a;font-weight:600}
.tab:hover:not(.on){background:#fafaf8}

.card{background:white;border:.5px solid #e0e0d8;border-radius:12px;padding:16px;margin-bottom:12px}
.card-title{font-size:13px;font-weight:600;color:#444;margin-bottom:12px}

/* car select */
.car-sel{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:4px}
.car-opt{border:1.5px solid #e0e0d8;border-radius:12px;padding:12px;cursor:pointer;transition:all .15s;background:white}
.car-opt:hover:not(.busy-car){border-color:#1D9E75}
.car-opt.selected{border-color:#1D9E75;background:#E8F8F2}
.car-opt.busy-car{opacity:.45;pointer-events:none;background:#fcf1ed;border-color:#f5d0c4}
.car-icon{font-size:24px}
.cn{font-size:13px;font-weight:600;margin-top:6px;color:#1a1a1a}
.cp{font-size:11px;color:#888;margin-top:2px}
.cbadge{font-size:10px;padding:2px 8px;border-radius:20px}
.avail-b{background:#E1F5EE;color:#0F6E56}
.busy-b{background:#FAECE7;color:#993C1D}
.location-tag{font-size:10px;color:#1D9E75;margin-top:4px;background:#f0faf6;padding:3px 6px;border-radius:4px}
.mileage-tag{font-size:10px;color:#185FA5;margin-top:3px;background:#eef4fc;padding:3px 6px;border-radius:4px}

/* form */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-size:12px;color:#666}
.req{color:#D85A30}
.field input,.field select,.field textarea{font-size:13px;padding:9px 11px;border-radius:8px;border:1px solid #ddd;background:white;color:#1a1a1a;font-family:'Sarabun',sans-serif;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:#1D9E75;box-shadow:0 0 0 3px rgba(29,158,117,.08)}
.field textarea{height:68px;resize:none}
.submit-btn{width:100%;padding:12px;background:#1D9E75;color:white;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;font-family:'Sarabun',sans-serif;transition:background .15s;margin-top:4px}
.submit-btn:hover{background:#0F6E56}
.submit-btn.blue{background:#185FA5}.submit-btn.blue:hover{background:#0c3d6e}
.submit-btn.red{background:#c0392b}.submit-btn.red:hover{background:#a93226}
.submit-btn:disabled{background:#aaa;cursor:default}

/* reminder box */
.reminder-box{background:#FFF8E7;border:1px solid #F5C842;border-radius:10px;padding:14px 16px;margin-bottom:12px}
.reminder-box .rb-title{font-size:13px;font-weight:600;color:#7a5c00;margin-bottom:8px}
.reminder-box .rb-row{font-size:12px;color:#5a4200;margin-bottom:5px;display:flex;align-items:flex-start;gap:6px}
.reminder-box .rb-row span{flex:1}

/* toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1D9E75;color:white;padding:10px 22px;border-radius:10px;font-size:13px;font-weight:600;z-index:9999;display:none;white-space:nowrap;pointer-events:none}
.toast.err{background:#D85A30}

/* modal */
.modal-overlay{background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:24px;position:fixed;inset:0;z-index:1000}
.modal-box{background:white;padding:22px;border-radius:16px;max-width:440px;width:100%;box-shadow:0 8px 24px rgba(0,0,0,.15);max-height:90vh;overflow-y:auto}
.modal-title{font-size:16px;font-weight:600;color:#1D9E75;margin-bottom:14px}
.modal-title.warn{color:#c0392b}
.modal-line{font-size:13px;margin-bottom:8px;color:#444;line-height:1.5}
.modal-btn{width:100%;padding:10px;background:#1D9E75;color:white;border:none;border-radius:8px;cursor:pointer;font-weight:600;font-family:'Sarabun',sans-serif;margin-top:8px;font-size:14px}
.modal-btn.grey{background:#888}
.modal-btn.red{background:#c0392b}
.modal-divider{border:none;border-top:1px solid #eee;margin:14px 0}
/* admin pin input */
.pin-wrap{display:flex;gap:8px;margin-top:6px}
.pin-wrap input{flex:1;font-size:15px;padding:10px;border:1.5px solid #ddd;border-radius:8px;font-family:'Sarabun',sans-serif;letter-spacing:4px;text-align:center}
.pin-wrap input:focus{outline:none;border-color:#185FA5}
.pin-err{color:#c0392b;font-size:12px;margin-top:6px;display:none}

/* list */
.brow{background:white;border:.5px solid #e0e0d8;border-radius:12px;padding:14px;margin-bottom:10px}
.brow-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px}
.brow-name{font-size:13px;font-weight:600;color:#1a1a1a}
.brow-car{font-size:11px;color:#888;margin-top:2px}
.brow-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:11px}
.brow-field{color:#999;margin-bottom:2px}
.brow-val{color:#333;font-weight:600}
.badge{font-size:10px;padding:3px 9px;border-radius:20px;white-space:nowrap;flex-shrink:0}
.badge.active{background:#E1F5EE;color:#0F6E56}
.badge.returned{background:#E8EEFF;color:#2a46aa}
.badge.cancelled{background:#F5F5F0;color:#999}
.cancel-btn{font-size:11px;padding:3px 10px;border:1px solid #e0c0c0;background:#fff8f6;color:#c0392b;border-radius:6px;cursor:pointer;font-family:'Sarabun',sans-serif;flex-shrink:0}
.cancel-btn:hover{background:#FAECE7}
.filter-bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.filter-btn{font-size:11px;padding:4px 12px;border-radius:20px;border:.5px solid #ddd;background:white;color:#666;cursor:pointer;font-family:'Sarabun',sans-serif}
.filter-btn.on{background:#1D9E75;color:white;border-color:#1D9E75}

/* calendar */
.cal-table{width:100%;border-collapse:collapse;font-size:11px}
.cal-table th,.cal-table td{border:.5px solid #e0e0d8;padding:8px;vertical-align:top}
.cal-table th{background:#F0F0EC;font-weight:600;color:#444;text-align:center}
.cal-booked-box{background:#FAECE7;border:.5px solid #f5d0c4;border-radius:5px;padding:4px;font-size:10px;color:#993C1D;margin-top:4px;line-height:1.4}
.cal-day-num{font-weight:600;font-size:12px;color:#555;display:block;text-align:center}
.cal-today{background:#F0FBF5}
.empty{text-align:center;padding:2.5rem;color:#aaa;font-size:13px}

.loading-overlay{position:fixed;inset:0;background:rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center;z-index:2000;font-size:14px;color:#555;gap:10px}
.spinner{width:20px;height:20px;border:2.5px solid #e0e0d8;border-top-color:#1D9E75;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:480px){
  .grid2{grid-template-columns:1fr}
  .brow-grid{grid-template-columns:1fr 1fr}
  .tabs .tab{font-size:10px;padding:8px 4px}
}
</style>
</head>
<body>

<div class="topbar">
  <div>
    <h1>🚗 ระบบจองรถส่วนกลาง
