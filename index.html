<script>
// =============================================
// ⚙️ CONFIG — แก้ GAS_URL หลัง deploy ใหม่

const GAS_URL = 'https://script.google.com/macros/s/AKfycbyvvJKNTcDJomTPuBq_okkmc4P9tw0b6MVXaNIkW6jFCYxckwDkOG-xXkm25eOrf154/exec';

];

// =============================================

let bookings = [];
let tab = 'form';
let filter = 'all';
let selCar = null;
let returnCarId = null;
let isSyncing = false;

// =============================================
// UTILS
// =============================================
function esc(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function todayStr() {
  const d = new Date();
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
}
function pad(n){ return String(n).padStart(2,'0'); }

function showToast(msg, isErr=false) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast'+(isErr?' err':'');
  el.style.display = 'block';
  clearTimeout(el._t);
  el._t = setTimeout(()=>{ el.style.display='none'; }, 3000);
}
function setLoading(show, text='กำลังบันทึก...') {
  document.getElementById('loading-overlay').style.display = show?'flex':'none';
  document.getElementById('loading-text').textContent = text;
}
function setSyncStatus(text) {
  const el = document.getElementById('sync-status-text');
  if (el) el.textContent = text;
}

function normalizeDate(v) {
  if (!v) return '';
  return String(v).trim().split('T')[0];
}

function isCarBusy(carId, fromDate, toDate) {
  if (!fromDate || !toDate) return false;
  const f = normalizeDate(fromDate);
  const t = normalizeDate(toDate);
  return bookings.some(b => {
    if (String(b.carId).trim() !== String(carId).trim()) return false;
    if (String(b.status).trim().toLowerCase() !== 'active') return false;
    const bF = normalizeDate(b.dateFrom);
    const bT = normalizeDate(b.dateTo);
    if (!bF || !bT) return false;
    return f <= bT && t >= bF;
  });
}

function getBusyInfo(carId, fromDate, toDate) {
  if (!fromDate || !toDate) return null;
  const f = normalizeDate(fromDate);
  const t = normalizeDate(toDate);
  return bookings.find(b => {
    if (String(b.carId).trim() !== String(carId).trim()) return false;
    if (String(b.status).trim().toLowerCase() !== 'active') return false;
    const bF = normalizeDate(b.dateFrom);
    const bT = normalizeDate(b.dateTo);
    if (!bF || !bT) return false;
    return f <= bT && t >= bF;
  }) || null;
}

function getLastInfo(carId) {
  const id = String(carId).trim();
  const base = bookings.filter(b =>
    String(b.carId).trim() === id &&
    (String(b.status).trim().toLowerCase()==='active' || String(b.status).trim().toLowerCase()==='returned')
  );
  const sorted = [...base].sort((a,b) => {
    const as = String(a.status).trim().toLowerCase();
    const bs = String(b.status).trim().toLowerCase();
    if (as==='returned' && bs!=='returned') return -1;
    if (bs==='returned' && as!=='returned') return  1;
    return (b.createdAt||'').localeCompare(a.createdAt||'');
  });
  if (sorted.length && sorted[0].floor && sorted[0].pillar) {
    return { floor:sorted[0].floor, pillar:sorted[0].pillar, by:sorted[0].name, mileage:sorted[0].mileage||'' };
  }
  return { floor:'ชั้น 1', pillar:'ลานจอดหลัก', by:'', mileage:'' };
}

// =============================================
// FETCH ENGINE (แทน JSONP เดิม)
// รองรับทุก browser และทุก device
// =============================================
function jsonpCall(params, onSuccess, onError, timeoutMs = 15000) {
  const cbName = '_cb_' + Date.now();
  const script = document.createElement('script');
  let timer;

  window[cbName] = function(data) {
    clearTimeout(timer);
    script.remove();
    delete window[cbName];
    if (data && data.success) onSuccess(data);
    else onError(data ? (data.error || 'Server error') : 'No response');
  };

  timer = setTimeout(() => {
    script.remove();
    delete window[cbName];
    onError('Timeout — ตรวจสอบ GAS_URL');
  }, timeoutMs);

  script.src = GAS_URL + '?' + params + '&callback=' + cbName + '&_t=' + Date.now();
  script.onerror = () => {
    clearTimeout(timer);
    script.remove();
    delete window[cbName];
    onError('Network error — โหลด script ไม่ได้');
  };
  document.head.appendChild(script);
}

// =============================================
// SYNC
// =============================================
function syncFromSheets(manual=false) {
  if (isSyncing) return;
  isSyncing = true;
  const btn = document.getElementById('sync-btn');
  if (btn) { btn.disabled=true; btn.textContent='⟳ กำลังซิงค์...'; }
  if (manual) setSyncStatus('กำลังซิงค์...');

  jsonpCall('action=getBookings',
    (data) => {
      isSyncing = false;
      if (btn) { btn.disabled=false; btn.textContent='⟳ ซิงค์'; }
      bookings = data.bookings || [];

      bookings.forEach(b => {
        b.carId   = String(b.carId  ||'').trim();
        b.status  = String(b.status ||'').trim().toLowerCase();
        b.dateFrom= normalizeDate(b.dateFrom);
        b.dateTo  = normalizeDate(b.dateTo);
        if (b.phone !== undefined && b.phone !== null) {
          const p = String(b.phone).trim();
          if (/^\d{9}$/.test(p)) b.phone = '0'+p;
          else b.phone = p;
        }
      });

      const now = new Date();
      setSyncStatus('ซิงค์ล่าสุด '+pad(now.getHours())+':'+pad(now.getMinutes())+':'+pad(now.getSeconds()));
      if (selCar && form.dateFrom && form.dateTo && isCarBusy(selCar, form.dateFrom, form.dateTo)) selCar = null;
      render();
      if (manual) showToast('ซิงค์สำเร็จ ('+bookings.length+' รายการ) ✓');
    },
    (err) => {
      isSyncing = false;
      if (btn) { btn.disabled=false; btn.textContent='⟳ ซิงค์'; }
      setSyncStatus('ซิงค์ไม่สำเร็จ');
      if (manual) showToast('ซิงค์ไม่สำเร็จ: '+err, true);
    }
  );
}
function scheduleAutoSync() {
  clearTimeout(syncTimer);
  syncTimer = setTimeout(()=>{ syncFromSheets(false); scheduleAutoSync(); }, 60000);
}

function confirmAdminPin() {
  const inp = document.getElementById('admin-pin-input');
  const err = document.getElementById('pin-err');
  if (!inp) return;
  if (inp.value === ADMIN_PIN) {
    closeModal();
    if (window._adminPinCb){ window._adminPinCb(); window._adminPinCb=null; }
  } else {
    err.style.display='block'; inp.value=''; inp.focus();
    inp.style.borderColor='#c0392b';
    setTimeout(()=>{ inp.style.borderColor='#ddd'; },1200);
  }
}

// =============================================
// FORM ACTIONS
// =============================================
function captureForm() {
  ['name','dept','phone','email','driver','purpose'].forEach(k=>{
    const el = document.getElementById('f-'+k);
    if (el) form[k] = el.value;
  });
}
function updateDates() {
  const fe = document.getElementById('f-from');
  const te = document.getElementById('f-to');
  if (fe) form.dateFrom = fe.value;
  if (te) form.dateTo   = te.value;
  if (form.dateFrom && form.dateTo && form.dateTo < form.dateFrom) {
    form.dateTo = form.dateFrom;
    if (te) te.value = form.dateFrom;
  }
  captureForm();
  if (selCar && form.dateFrom && form.dateTo && isCarBusy(selCar, form.dateFrom, form.dateTo)) selCar = null;
  render();
}
function setSelCar(id) { captureForm(); selCar = id; render(); }
function setTab(t) { captureForm(); tab = t; render(); }
function setFilter(f) { filter = f; render(); }
function selectReturn(id) { returnCarId = id; render(); }
function calPrev()    { calMonth--; if(calMonth<0){calMonth=11;calYear--;} render(); }
function calNext()    { calMonth++; if(calMonth>11){calMonth=0;calYear++;} render(); }
function calGoToday() { calYear=new Date().getFullYear(); calMonth=new Date().getMonth(); render(); }

// =============================================
// SUBMIT BOOKING
// =============================================
function submit() {
  captureForm();
  if (!form.dateFrom || !form.dateTo) { showToast('ระบุวันที่ยืม-คืนก่อนครับ',true); return; }
  if (form.dateTo < form.dateFrom)    { showToast('วันคืนต้องไม่ก่อนวันยืม',true); return; }
  if (!selCar)                        { showToast('เลือกรถยนต์ก่อนครับ',true); return; }

  if (isCarBusy(selCar, form.dateFrom, form.dateTo)) {
    const b = getBusyInfo(selCar, form.dateFrom, form.dateTo);
    showToast('รถคันนี้ถูกจองในช่วงนี้แล้ว'+(b?' (โดย '+b.name+')':''), true);
    selCar = null; render(); return;
  }
  if (!form.name.trim())  { showToast('ระบุชื่อผู้ใช้งาน',true); return; }
  if (!form.email.trim() || !form.email.includes('@')) { showToast('ระบุ Email ให้ถูกต้อง',true); return; }
  if (!form.purpose.trim()) { showToast('ระบุวัตถุประสงค์',true); return; }

  const info = getLastInfo(selCar);
  const car  = CARS.find(c => c.id === selCar);
  const id   = Date.now().toString();
  const now  = new Date().toISOString();
  const phoneVal = form.phone.trim();

  const params = [
    'action=addBooking',
    'id='       +encodeURIComponent(id),
    'carId='    +encodeURIComponent(selCar),
    'name='     +encodeURIComponent(form.name.trim()),
    'dept='     +encodeURIComponent(form.dept.trim()),
    'phone='    +encodeURIComponent(phoneVal),
    'driver='   +encodeURIComponent(form.driver.trim()),
    'email='    +encodeURIComponent(form.email.trim()),
    'dateFrom=' +encodeURIComponent(form.dateFrom),
    'dateTo='   +encodeURIComponent(form.dateTo),
    'purpose='  +encodeURIComponent(form.purpose.trim()),
    'floor='    +encodeURIComponent(info.floor),
    'pillar='   +encodeURIComponent(info.pillar),
    'status=active',
    'createdAt='+encodeURIComponent(now),
  ].join('&');

  setLoading(true,'กำลังบันทึกการจอง...');
  jsonpCall(params,
    ()=>{
      setLoading(false);
      showModal('🎉 ส่งคำขอจองสำเร็จ!',[
        `<b>🚗 รถทะเบียน:</b> ${car.plate} (${car.name})`,
        `<b>👤 ผู้จอง:</b> ${esc(form.name)}`,
        `<b>📅 วันยืม:</b> ${form.dateFrom} &nbsp;→&nbsp; <b>วันคืน:</b> ${form.dateTo}`,
        `<b>🅿️ พิกัดรับรถ:</b> <span style="color:#1D9E75;font-weight:600">${esc(info.floor)} เสา ${esc(info.pillar)}</span>`,
        `<br><small style="color:#aaa">✉️ ส่งข้อมูลไปที่อีเมลของคุณเรียบร้อย</small>`,
      ],()=>{ showReminderModal(car,info); });
      form={name:'',dept:'',phone:'',dateFrom:'',dateTo:'',purpose:'',driver:'',email:''};
      selCar=null;
    },
    (err)=>{
      setLoading(false);
      showToast(err,true);
      syncFromSheets(false);
    }
  );
}

// =============================================
// RETURN CAR
// =============================================
function executeReturn(id) {
  const fv = (document.getElementById('ret-floor')   ||{}).value||'';
  const pv = (document.getElementById('ret-pillar')  ||{}).value||'';
  const mv = (document.getElementById('ret-mileage') ||{}).value||'';
  if (!fv.trim()) { showToast('ระบุชั้นที่จอดคืน',true); return; }
  if (!pv.trim()) { showToast('ระบุเลขเสาที่จอดคืน',true); return; }
  if (!mv.trim()) { showToast('ระบุเลขไมล์สุดท้ายก่อนคืนรถ',true); return; }
  if (isNaN(Number(mv))) { showToast('เลขไมล์ต้องเป็นตัวเลข',true); return; }
  const b = bookings.find(x=>x.id==id);
  const car = b?CARS.find(c=>c.id===b.carId):null;
  if (!b){ showToast('ไม่พบรายการจอง',true); return; }
  const params=['action=updateStatus','id='+encodeURIComponent(id),'status=returned',
    'floor='+encodeURIComponent(fv.trim()),
    'pillar='+encodeURIComponent(pv.trim()),
    'mileage='+encodeURIComponent(mv.trim())].join('&');
  setLoading(true,'กำลังบันทึกการคืนรถ...');
  jsonpCall(params,
    ()=>{
      setLoading(false); returnCarId=null;
      showModal('✅ คืนรถสำเร็จ!',[
        `<b>🚗 รถทะเบียน:</b> ${car?car.plate:''}`,
        `<b>👤 ผู้คืน:</b> ${esc(b.name)}`,
        `<b>🅿️ จอดคืนที่:</b> ${esc(fv.trim())} เสา ${esc(pv.trim())}`,
        `<b>🔢 เลขไมล์สุดท้าย:</b> <span style="color:#185FA5;font-weight:600">${esc(mv.trim())} กม.</span>`,
      ],()=>{ tab='list'; syncFromSheets(false); });
    },
    (err)=>{ setLoading(false); showToast('บันทึกไม่สำเร็จ: '+err,true); }
  );
}
function cancelBook(id) {
  askAdminPin(()=>{
    const params='action=updateStatus&id='+encodeURIComponent(id)+'&status=cancelled';
    setLoading(true,'กำลังยกเลิก...');
    jsonpCall(params,
      ()=>{ setLoading(false); syncFromSheets(false); showToast('ยกเลิกการจองสำเร็จ ✓'); },
      (err)=>{ setLoading(false); showToast('ยกเลิกไม่สำเร็จ: '+err,true); }
    );
  });
}

// =============================================
// MONTHLY CALENDAR
// =============================================
function generateMonthlyCalendar() {
  const thMonths=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน',
                  'กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
  const dayHdr=['จ','อ','พ','พฤ','ศ','ส','อา'];
  const today = todayStr();

  const firstDay = new Date(calYear, calMonth, 1);
  let startOffset = firstDay.getDay()===0 ? 6 : firstDay.getDay()-1;
  const gridStart = new Date(firstDay);
  gridStart.setDate(1 - startOffset);

  let html = `
    <div class="cal-nav">
      <button class="cal-nav-btn" onclick="calPrev()">‹</button>
      <div style="display:flex;align-items:center;gap:8px">
        <span class="cal-nav-title">${thMonths[calMonth]} ${calYear+543}</span>
        <button class="cal-today-btn" onclick="calGoToday()">วันนี้</button>
      </div>
      <button class="cal-nav-btn" onclick="calNext()">›</button>
    </div>
    <div class="cal-grid">`;

  dayHdr.forEach((d,i)=>{
    let cls='cal-header-cell';
    if(i===5) cls+=' sat';
    if(i===6) cls+=' sun';
    html+=`<div class="${cls}">${d}</div>`;
  });

  for(let r=0;r<6;r++){
    for(let c=0;c<7;c++){
      const cd = new Date(gridStart);
      cd.setDate(gridStart.getDate()+r*7+c);
      const ds = cd.getFullYear()+'-'+pad(cd.getMonth()+1)+'-'+pad(cd.getDate());
      const isThisMonth = cd.getMonth()===calMonth;
      const isToday     = ds===today;

      const bks1 = bookings.filter(b=>
        String(b.carId).trim()==='1723' &&
        String(b.status).trim().toLowerCase()==='active' &&
        ds >= normalizeDate(b.dateFrom) && ds <= normalizeDate(b.dateTo)
      );
      const bks2 = bookings.filter(b=>
        String(b.carId).trim()==='7902' &&
        String(b.status).trim().toLowerCase()==='active' &&
        ds >= normalizeDate(b.dateFrom) && ds <= normalizeDate(b.dateTo)
      );
      const hasBk = bks1.length>0||bks2.length>0;

      let cls='cal-cell';
      if(!isThisMonth) cls+=' other-month';
      if(isToday)      cls+=' today-cell';
      if(c===5)        cls+=' sat-cell';
      if(c===6)        cls+=' sun-cell';
      if(hasBk)        cls+=' has-booking';

      let chips='';
      bks1.forEach(b=>{ chips+=`<span class="cal-chip chip-1723">🚗1723: ${esc(b.name)}</span>`; });
      bks2.forEach(b=>{ chips+=`<span class="cal-chip chip-7902">🚗7902: ${esc(b.name)}</span>`; });

      html+=`<div class="${cls}">
        <span class="cal-day-num">${cd.getDate()}</span>
        ${chips}
      </div>`;
    }
  }

  html+=`</div>
    <div class="cal-legend">
      <span><span style="background:#d4edde;color:#0a5c40;padding:1px 7px;border-radius:3px;font-weight:600">■</span>&nbsp;ทะเบียน 1723</span>
      <span><span style="background:#d4e4ff;color:#1a3c8a;padding:1px 7px;border-radius:3px;font-weight:600">■</span>&nbsp;ทะเบียน 7902</span>
    </div>`;
  return html;
}

    bookings.some(b=>
      String(b.carId).trim()===c.id &&
      String(b.status).trim().toLowerCase()==='active' &&
      normalizeDate(b.dateFrom)<=ts && normalizeDate(b.dateTo)>=ts

    <div class="stat"><div class="sl">รถว่างวันนี้</div><div class="sv ${availToday>0?'green':'red'}">${availToday} / ${CARS.length} คัน</div></div>

        <div class="brow-top">
          <div>
            <div class="brow-name">${esc(b.name)} <small style="color:#666;font-weight:400">(${esc(b.dept||'ไม่ระบุ')})</small></div>
            <div class="brow-car">${car.icon} ${car.name} (ทะเบียน ${car.plate})</div>
          </div>
          <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">
            <span class="badge ${badgeCls}">${st}</span>
            ${statusKey==='active'?`<button class="cancel-btn" onclick="cancelBook('${b.id}')">ยกเลิก</button>`:''}
          </div>
        </div>
        <div class="brow-grid">
          <div><div class="brow-field">วันเริ่มยืม</div><div class="brow-val">${b.dateFrom||'-'}</div></div>
          <div><div class="brow-field">วันสิ้นสุด</div><div class="brow-val">${b.dateTo||'-'}</div></div>
          <div><div class="brow-field">เบอร์ติดต่อ</div><div class="brow-val">${esc(b.phone||'-')}</div></div>
        </div>
        <div style="font-size:11px;color:#666;margin-top:8px;border-top:.5px solid #eee;padding-top:6px;line-height:1.5">
          <b>📍 พิกัดจอด:</b> ${esc(b.floor||'-')} เสา ${esc(b.pillar||'-')}
          ${b.mileage?` | 🔢 <b>เลขไมล์:</b> ${esc(b.mileage)} กม.`:''}<br>
          <b>💡 ไปที่ไหน/ทำอะไร:</b> ${esc(b.purpose)}
        </div>
      </div>`;
    }).join('');
    content=`
      <div class="filter-bar">
        <button class="filter-btn ${filter==='all'?'on':''}"       onclick="setFilter('all')">ทั้งหมด</button>
        <button class="filter-btn ${filter==='active'?'on':''}"    onclick="setFilter('active')">กำลังจอง</button>
        <button class="filter-btn ${filter==='returned'?'on':''}"  onclick="setFilter('returned')">คืนแล้ว</button>
        <button class="filter-btn ${filter==='cancelled'?'on':''}" onclick="setFilter('cancelled')">ยกเลิกแล้ว</button>
      </div>
      ${cards||'<div class="empty">ไม่พบข้อมูลประวัติการจอง</div>'}`;
  }

  document.getElementById('root').innerHTML = stats+tabBar+content;
}

// =============================================
// INIT
// =============================================
window.onload = function() {
  syncFromSheets(false);
  scheduleAutoSync();
};
</script>
</body>
</html>
